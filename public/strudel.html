<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
</head>
<body>
<strudel-editor id="repl" style="display:none;"></strudel-editor>
<script>
const el = document.getElementById('repl');
let ready = false;

function waitForRepl() {
  return new Promise((resolve) => {
    const check = () => {
      if (el && el.editor) {
        ready = true;
        resolve();
      } else {
        setTimeout(check, 200);
      }
    };
    check();
  });
}

window.addEventListener('message', async (e) => {
  if (e.data?.type === 'eval') {
    try {
      await waitForRepl();
      el.editor.setCode(e.data.code);
      el.editor.start();
      window.parent.postMessage({ type: 'playing' }, '*');
    } catch(err) {
      console.error('[strudel]', err);
      window.parent.postMessage({ type: 'error', message: err.message }, '*');
    }
  }
  if (e.data?.type === 'stop') {
    try {
      if (ready && el.editor) el.editor.stop();
      window.parent.postMessage({ type: 'stopped' }, '*');
    } catch(err) {
      console.error('[strudel stop]', err);
    }
  }
});

window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
