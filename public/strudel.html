<!DOCTYPE html>
<html>
<head>
<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6"
  }
}
</script>
</head>
<body>
<script type="module">
import * as core from '@strudel/core';
import * as mini from '@strudel/mini';
import * as webaudio from '@strudel/webaudio';
import * as tonal from '@strudel/tonal';

// Register all functions in Strudel's eval scope — this is what evaluate() uses internally
core.evalScope(
  core.controls,
  core,
  mini,
  webaudio,
  tonal,
  { samples: webaudio.samples }
);

let scheduler = null;

async function init() {
  if (scheduler) return true;
  try {
    const ctx = webaudio.getAudioContext();
    if (ctx.state === 'suspended') await ctx.resume();
    webaudio.registerSynthSounds();

    scheduler = await core.repl({
      defaultOutput: webaudio.webaudioOutput,
    });
    console.log('[strudel] ready');
    return true;
  } catch(e) {
    console.error('[strudel] init error:', e);
    return false;
  }
}

window.addEventListener('message', async (e) => {
  if (e.data?.type === 'eval') {
    const ok = await init();
    if (!ok) {
      window.parent.postMessage({ type: 'error', message: 'Audio engine failed to init' }, '*');
      return;
    }
    try {
      await scheduler.evaluate(e.data.code);
      window.parent.postMessage({ type: 'playing' }, '*');
    } catch(err) {
      console.error('[strudel] eval:', err);
      window.parent.postMessage({ type: 'error', message: err.message }, '*');
    }
  }
  if (e.data?.type === 'stop') {
    if (scheduler) {
      scheduler.stop();
      window.parent.postMessage({ type: 'stopped' }, '*');
    }
  }
});

window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
