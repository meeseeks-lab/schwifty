<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    #repl { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="https://unpkg.com/@strudel/repl@latest"></script>
  <script>
    // Read initial code from hash
    let initialCode = 's("bd sd cp hh")';
    if (window.location.hash.length > 1) {
      try {
        initialCode = decodeURIComponent(escape(atob(window.location.hash.slice(1))));
      } catch(e) { console.error('decode error', e); }
    }

    // Create the editor element with initial code
    const el = document.createElement('strudel-editor');
    el.id = 'repl';
    el.setAttribute('code', initialCode);
    document.getElementById('container').appendChild(el);

    // Listen for code updates from parent
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'setCode' && e.data.code) {
        el.setAttribute('code', e.data.code);
        window.parent.postMessage({ type: 'codeSet' }, '*');
      }
    });

    window.parent.postMessage({ type: 'ready' }, '*');
  </script>
</body>
</html>
