<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>body{margin:0;background:#000;}</style>
</head>
<body>
<script type="module">
import { controls, repl } from 'https://unpkg.com/@strudel/repl@0.9.15';

let currentRepl = null;

async function initRepl() {
  if (currentRepl) return currentRepl;
  currentRepl = await repl({
    defaultOutput: 'speaker',
    afterEval: () => {
      window.parent.postMessage({ type: 'playing' }, '*');
    },
  });
  return currentRepl;
}

window.addEventListener('message', async (e) => {
  if (e.data.type === 'eval') {
    try {
      const r = await initRepl();
      await r.evaluate(e.data.code);
      window.parent.postMessage({ type: 'playing' }, '*');
    } catch (err) {
      window.parent.postMessage({ type: 'error', message: err.message }, '*');
    }
  } else if (e.data.type === 'stop') {
    if (currentRepl) {
      currentRepl.stop();
      window.parent.postMessage({ type: 'stopped' }, '*');
    }
  }
});

// Signal ready
window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
