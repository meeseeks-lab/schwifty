<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
  {
    "imports": {
      "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
      "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
      "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
      "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6"
    }
  }
  </script>
</head>
<body>
<script type="module">
import { controls, repl } from '@strudel/core';
import { mini } from '@strudel/mini';
import { webaudioOutput, registerSynthSounds, initAudioOnFirstClick, getAudioContext, samples } from '@strudel/webaudio';
import '@strudel/tonal';

let scheduler;
let initialized = false;

async function init() {
  if (initialized) return;
  try {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') await ctx.resume();
    registerSynthSounds();
    await samples('https://strudel.cc/samples.json');
    scheduler = await repl({
      defaultOutput: webaudioOutput,
      afterEval: () => {},
      beforeEval: () => {},
    });
    initialized = true;
    console.log('[strudel] initialized');
  } catch(e) {
    console.error('[strudel] init error:', e);
  }
}

window.addEventListener('message', async (e) => {
  if (e.data?.type === 'eval') {
    await init();
    try {
      await scheduler.evaluate(e.data.code);
      window.parent.postMessage({ type: 'playing' }, '*');
    } catch(err) {
      console.error('[strudel] eval error:', err);
      window.parent.postMessage({ type: 'error', message: err.message }, '*');
    }
  }
  if (e.data?.type === 'stop') {
    if (scheduler) {
      scheduler.stop();
      window.parent.postMessage({ type: 'stopped' }, '*');
    }
  }
});

// Signal ready
window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
