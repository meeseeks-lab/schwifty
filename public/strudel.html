<!DOCTYPE html>
<html>
<head>
<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6"
  }
}
</script>
</head>
<body>
<script type="module">
import { controls, repl } from '@strudel/core';
import { mini } from '@strudel/mini';
import { webaudioOutput, registerSynthSounds, getAudioContext, samples } from '@strudel/webaudio';
import '@strudel/tonal';

let scheduler = null;

async function init() {
  if (scheduler) return true;
  try {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') await ctx.resume();
    registerSynthSounds();

    // Load samples through our CORS proxy
    try {
      await samples('/api/samples');
    } catch(e) {
      console.warn('[strudel] samples failed, synths only:', e.message);
    }

    scheduler = await repl({
      defaultOutput: webaudioOutput,
    });
    console.log('[strudel] ready');
    return true;
  } catch(e) {
    console.error('[strudel] init error:', e);
    return false;
  }
}

window.addEventListener('message', async (e) => {
  if (e.data?.type === 'eval') {
    const ok = await init();
    if (!ok) {
      window.parent.postMessage({ type: 'error', message: 'Audio engine failed to initialize' }, '*');
      return;
    }
    try {
      await scheduler.evaluate(e.data.code);
      window.parent.postMessage({ type: 'playing' }, '*');
    } catch(err) {
      console.error('[strudel] eval:', err);
      window.parent.postMessage({ type: 'error', message: err.message }, '*');
    }
  }
  if (e.data?.type === 'stop') {
    if (scheduler) {
      scheduler.stop();
      window.parent.postMessage({ type: 'stopped' }, '*');
    }
  }
});

window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
